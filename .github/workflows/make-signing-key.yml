# One-time: makes the app's Android signing key on GitHub, for when there is
# no computer at hand to run keytool (app/README.md, "One-time setup").
#
# Before running it, save a long password (16 characters or more) as the repo
# secret ANDROID_KEYSTORE_PASSWORD. The key is locked with that password.
#
# The run leaves an artifact "signing-key" holding:
#   - foodapp-release.p12              the key file: keep it safe for good;
#   - ANDROID_KEYSTORE_BASE64.txt      the same file as text, to paste into the
#                                      repo secret ANDROID_KEYSTORE_BASE64.
# The artifact is kept for 1 day only. Download it, save the zip somewhere
# safe (it's the backup of the key), paste the secret, then delete the
# artifact from the run page.
#
# It refuses to run once ANDROID_KEYSTORE_BASE64 is set, so the key that
# phones already trust is never replaced by accident.
name: Make signing key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make:
    name: Make the key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      HAVE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      ALIAS: ${{ vars.ANDROID_KEY_ALIAS || 'foodapp' }}
    steps:
      - name: Check it is safe to make one
        run: |
          if [ "$HAVE_KEY" = "true" ]; then
            echo "::error title=Key already set::ANDROID_KEYSTORE_BASE64 is already set. Making a new key would stop phones from updating. Nothing was made."
            exit 1
          fi
          if [ ${#ANDROID_KEYSTORE_PASSWORD} -lt 16 ]; then
            echo "::error title=Password needed::Save a password of 16 characters or more as the repo secret ANDROID_KEYSTORE_PASSWORD first, then run this again."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make the key
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/key"
          cd "$RUNNER_TEMP/key"
          keytool -genkeypair -storetype PKCS12 -keystore foodapp-release.p12 -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Food app" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEYSTORE_PASSWORD
          base64 -w0 foodapp-release.p12 > ANDROID_KEYSTORE_BASE64.txt
          keytool -list -v -keystore foodapp-release.p12 -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ALIAS" | grep 'SHA256:' | awk '{print $NF}' > certificate-sha256.txt
          echo "Key made. Certificate SHA-256: \`$(cat certificate-sha256.txt)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Next: download the **signing-key** artifact below, paste ANDROID_KEYSTORE_BASE64.txt into the repo secret ANDROID_KEYSTORE_BASE64, keep the zip safe, then delete the artifact." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: ${{ runner.temp }}/key/
          retention-days: 1
          if-no-files-found: error

      - name: Delete the key from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/key"
